
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-qa-peft"
version = "0.1.0"
description = "Comparing prompt engineering, prefix tuning and LoRA for biomedical research QA (Llama 3.2 3B, PubMedQA)"
requires-python = ">=3.10"
# Exact versions live in requirements.txt (local) and requirements-colab.txt (GPU).
dependencies = [
    "torch",
    "transformers",
    "peft",
    "datasets",
    "evaluate",
    "nltk",
    "scikit-learn",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "plotly",
    "tabulate",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biomedical_qa_peft.viz" = ["explorer.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
